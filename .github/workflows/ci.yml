name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy", targets: "wasm32v1-none" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # the factory embeds the circle wasm at compile time, so build it first
      - name: build the circle for the chain it runs on
        run: cargo build -p circlefi-circle --target wasm32v1-none --release
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: build every contract for the chain
        run: cargo build --target wasm32v1-none --release
      - name: report the deployed size
        run: ls -l target/wasm32v1-none/release/*.wasm
